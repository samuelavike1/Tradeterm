[package]
name = "tt-brokers"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Market-data adapters for tradeterm."

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tt-core = { version = "0.1.0", path = "../tt-core" }

[dev-dependencies]
crossbeam-channel = "0.5.17"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
