[package]
name = "tt-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-independent app state for tradeterm: chart tabs (live streams, backfill), settings persistence, background runtime, synthetic data."

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
ecolor = "0.37.0"
jiff = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tt-brokers = { version = "0.1.0", path = "../tt-brokers" }
tt-chart = { version = "0.1.0", path = "../tt-chart" }
tt-core = { version = "0.1.0", path = "../tt-core" }
tt-theme = { version = "0.1.0", path = "../tt-theme" }

[dev-dependencies]
tempfile = "3.27.0"
