[package]
name = "tt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "tradeterm desktop app on gpui (gpui-kit / gpui-component)."

[[bin]]
name = "tradeterm-gpui"
path = "src/main.rs"

[dependencies]
egui = "0.37.0"
futures = "0.3.34"
gpui-kit = "=0.10.0"
lucide-icons = "1.77.0"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tt-brokers = { path = "../tt-brokers" }
tt-chart = { path = "../tt-chart" }
tt-chart-gpui = { path = "../tt-chart-gpui" }
tt-core = { path = "../tt-core" }
tt-session = { path = "../tt-session" }
tt-theme = { path = "../tt-theme" }
