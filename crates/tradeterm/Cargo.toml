[package]
name = "tradeterm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
lucide-icons = "1.77.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tt-brokers = { version = "0.1.0", path = "../tt-brokers" }
tt-chart = { version = "0.1.0", path = "../tt-chart" }
tt-core = { version = "0.1.0", path = "../tt-core" }
tt-session = { path = "../tt-session" }
tt-theme = { version = "0.1.0", path = "../tt-theme" }

[dev-dependencies]
tempfile = "3.27.0"
