[package]
name = "tradeterm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "tradeterm: native desktop charting (gpui / gpui-component)."

[dependencies]
ecolor = "0.37.0"
emath = "0.37.0"
futures = "0.3.34"
gpui-kit = "=0.10.0"
lucide-icons = "1.77.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
tiny-skia = "0.11.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tt-brokers = { path = "../tt-brokers" }
tt-chart = { path = "../tt-chart" }
tt-chart-gpui = { path = "../tt-chart-gpui" }
tt-core = { path = "../tt-core" }
tt-session = { path = "../tt-session" }
tt-theme = { path = "../tt-theme" }
tt-ui = { path = "../tt-ui" }
ttf-parser = "0.25.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
